<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MegaNote - App de notas con diseño semi-brutalista" />
    <title>MegaNote // Notas Brutalistas</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Encabezado principal -->
    <header class="app-header">
        <h1 class="app-title">MEGA<span class="accent">NOTE</span></h1>
        <p class="app-subtitle">Tus ideas. Sin filtros. Sin adornos.</p>
    </header>

    <!-- Contenedor principal -->
    <main class="app-main">
        <!-- Editor de notas -->
        <section class="note-editor" aria-label="Editor de notas">
            <div class="brutalist-card editor-card">
                <form id="note-form">
                    <input type="text" id="note-title" placeholder="TÍTULO DE LA NOTA..." required class="brutalist-input" />
                    <textarea id="note-content" placeholder="Escribe algo importante aquí..." required class="brutalist-input"></textarea>
                    <button type="submit" class="brutalist-button">GUARDAR NOTA</button>
                </form>
            </div>
        </section>

        <!-- Listado de notas -->
        <section class="note-list" id="note-container" aria-label="Listado de notas">
            <!-- Las notas se insertarán aquí dinámicamente -->
             <div class="empty-state">
                <p>NO HAY NOTAS. COMIENZA A ESCRIBIR.</p>
             </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="app-footer">
        <small>&copy; 2026 MegaNote // RAW_EDITION</small>
    </footer>

    <script src="main.js"></script>
</body>
</html>
